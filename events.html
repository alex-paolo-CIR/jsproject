<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dash. | Events</title>
</head>
<body class="events-page">
    <a href="index.html" class="brand-link">DASH.</a>

    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="merch.html">merch</a></li>
            <li><a href="tracks">tracks</a></li>
            <li><a href="history.html">history</a></li>
            <li><a href="events.html" aria-current="page">events</a></li>
        </ul>
    </nav>

    <main class="events-wrapper">
        <header class="events-header">
            <p class="events-kicker">Live schedule</p>
            <h1>Prochains events</h1>
            <p class="events-lead">Retrouve ici les prochaines dates de DASH.</p>
        </header>

        <section id="next-event" class="next-event-card" aria-live="polite">
            <p class="next-event-label">Prochaine date</p>
            <h2 id="next-event-title">Chargement...</h2>
            <p id="next-event-meta" class="next-event-meta"></p>
            <p id="next-event-countdown" class="next-event-countdown"></p>
            <div id="next-event-actions" class="calendar-actions"></div>
        </section>

        <section class="upcoming-events-section" aria-label="Liste des prochains events">
            <h2>Calendrier a venir</h2>
            <div id="upcoming-events" class="events-grid"></div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
